name: Probe data sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/probe.sh > /tmp/probe-output.txt 2>&1 || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish raw samples to probe-output branch
        run: |
          mv raw /tmp/out && cp /tmp/probe-output.txt /tmp/out/ && cd /tmp/out
          find . -type f -size +95M -delete
          git init -q -b probe-output && git add .
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "raw samples"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-output
